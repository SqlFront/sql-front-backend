name: Debug and Logs

on:
  workflow_dispatch:
    inputs:
      lines:
        description: 'Number of log lines to show'
        required: false
        default: '50'
      service:
        description: 'Target service'
        required: false
        default: 'backend'
        type: choice
        options:
          - backend
          - frontend
          - postgres
          - all

jobs:
  debug:
    runs-on: self-hosted
    steps:
      - name: Inspect Services and Show Summary
        run: |
          cd /home/admin/sqlfront/sql-backend
          LINES="${{ github.event.inputs.lines }}"
          SERVICE="${{ github.event.inputs.service }}"
          
          # Print into GitHub Actions Step Summary (visible directly on run overview page without downloading logs)
          echo "## 🚀 Container Status" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          docker compose ps >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          if [ "$SERVICE" = "all" ]; then
            for s in backend frontend postgres; do
              echo "## 📋 Logs: $s (last $LINES lines)" >> $GITHUB_STEP_SUMMARY
              echo '```text' >> $GITHUB_STEP_SUMMARY
              docker compose logs --no-color --tail "$LINES" "$s" >> $GITHUB_STEP_SUMMARY 2>&1
              echo '```' >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "## 📋 Logs: $SERVICE (last $LINES lines)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            docker compose logs --no-color --tail "$LINES" "$SERVICE" >> $GITHUB_STEP_SUMMARY 2>&1
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          
          # Also print to stdout for standard console view
          echo "=== DOCKER COMPOSE PS ==="
          docker compose ps
          echo "=== $SERVICE LOGS ==="
          docker compose logs --no-color --tail "$LINES" "$SERVICE"
