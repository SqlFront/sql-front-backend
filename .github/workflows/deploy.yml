name: Deploy to Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      reload_db:
        description: 'Reload users_db from /backups/users_db.sql'
        required: false
        type: boolean
        default: false
      set_admin_username:
        description: 'Set ADMIN_USERNAME in .env (leave blank to keep current)'
        required: false
        type: string
        default: ''
      set_admin_password:
        description: 'Set ADMIN_PASSWORD in .env (leave blank to keep current)'
        required: false
        type: string
        default: ''
      reset_admin_creds:
        description: 'Reset ADMIN_USERNAME=admin and ADMIN_PASSWORD=admin in .env'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Deploy Backend and Stack
        run: |
          echo "Updating deployment at /home/admin/sqlfront..."
          
          cd /home/admin/sqlfront/sql-backend
          git fetch origin
          git reset --hard origin/main
          
          if [ -d "/home/admin/sqlfront/sql-frontend" ]; then
            echo "Updating frontend..."
            cd /home/admin/sqlfront/sql-frontend
            git fetch origin
            git reset --hard origin/main
            cd /home/admin/sqlfront/sql-backend
          fi
          
          # Manage .env admin credentials via workflow inputs or defaults
          if [ "${{ github.event.inputs.reset_admin_creds }}" = "true" ]; then
            echo "Resetting admin credentials to standard admin/admin in .env..."
            grep -q "^ADMIN_USERNAME=" .env && sed -i "s/^ADMIN_USERNAME=.*/ADMIN_USERNAME=admin/" .env || echo "ADMIN_USERNAME=admin" >> .env
            grep -q "^ADMIN_PASSWORD=" .env && sed -i "s/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=admin/" .env || echo "ADMIN_PASSWORD=admin" >> .env
          fi

          if [ -n "${{ github.event.inputs.set_admin_username }}" ]; then
            echo "Updating ADMIN_USERNAME in .env..."
            grep -q "^ADMIN_USERNAME=" .env && sed -i "s/^ADMIN_USERNAME=.*/ADMIN_USERNAME=${{ github.event.inputs.set_admin_username }}/" .env || echo "ADMIN_USERNAME=${{ github.event.inputs.set_admin_username }}" >> .env
          fi

          if [ -n "${{ github.event.inputs.set_admin_password }}" ]; then
            echo "Updating ADMIN_PASSWORD in .env..."
            grep -q "^ADMIN_PASSWORD=" .env && sed -i "s/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=${{ github.event.inputs.set_admin_password }}/" .env || echo "ADMIN_PASSWORD=${{ github.event.inputs.set_admin_password }}" >> .env
          fi

          # Ensure standard admin credentials exist in .env if completely absent
          grep -q "^ADMIN_USERNAME=" .env || echo "ADMIN_USERNAME=admin" >> .env
          grep -q "^ADMIN_PASSWORD=" .env || echo "ADMIN_PASSWORD=admin" >> .env

          echo "Admin configuration verified in .env: ADMIN_USERNAME=$(grep '^ADMIN_USERNAME=' .env | cut -d= -f2-)"
          
          # 1. Immediately ensure containers are running to prevent 502 Bad Gateway
          echo "Ensuring existing containers are up..."
          docker compose up -d || true

          # 2. Try setting reliable Docker registry mirrors if sudo is available
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            if ! grep -q "timeweb.cloud" /etc/docker/daemon.json 2>/dev/null; then
              echo "Configuring Docker registry mirrors in /etc/docker/daemon.json..."
              sudo mkdir -p /etc/docker
              cat << 'EOF' | sudo tee /etc/docker/daemon.json >/dev/null
{
  "registry-mirrors": [
    "https://mirror.gcr.io",
    "https://dockerhub.timeweb.cloud"
  ]
}
EOF
              sudo systemctl reload docker 2>/dev/null || sudo systemctl restart docker 2>/dev/null || true
              sleep 2
            fi
          fi

          # 3. Build containers without dropping old ones first
          echo "Building containers (with retry and fallback)..."
          BUILD_SUCCESS=false
          for i in 1 2 3; do
            echo "Build attempt $i of 3..."
            if docker compose build; then
              BUILD_SUCCESS=true
              break
            fi
            echo "Build attempt $i encountered an issue, retrying in 5 seconds..."
            sleep 5
          done

          if [ "$BUILD_SUCCESS" != "true" ]; then
            echo "Standard BuildKit build failed (likely Docker Hub timeout). Attempting legacy builder DOCKER_BUILDKIT=0..."
            DOCKER_BUILDKIT=0 docker compose build || echo "Warning: build with DOCKER_BUILDKIT=0 failed, proceeding with current images"
          fi

          # 4. Restart containers with newly built images
          echo "Restarting containers..."
          docker compose up -d --remove-orphans
          
          echo "Waiting 10 seconds for services to initialize..."
          sleep 10
          
          # Check if DB reload requested via commit message [reload-db] or workflow dispatch
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -qi "\[reload-db\]" || [ "${{ github.event.inputs.reload_db }}" = "true" ]; then
            echo "=========================================================="
            echo "=== [reload-db] detected: reloading users_db from dump ==="
            echo "=========================================================="
            docker compose exec -T postgres psql -U postgres -c "DROP DATABASE IF EXISTS users_db WITH (FORCE);"
            docker compose exec -T postgres psql -U postgres -c "CREATE DATABASE users_db;"
            docker compose exec -T postgres psql -U postgres -d users_db -c "CREATE EXTENSION IF NOT EXISTS timescaledb;"
            docker compose exec -T postgres psql -U postgres -d users_db -f /backups/users_db.sql
            echo "Restarting backend to apply migrations..."
            docker compose restart backend
            sleep 5
          fi
          
          echo "=========================================================="
          echo "=== Container Status ==="
          echo "=========================================================="
          docker compose ps
          
          echo "=========================================================="
          echo "=== Backend Startup & Migration Logs ==="
          echo "=========================================================="
          docker compose logs --tail 100 backend
          
          echo "=========================================================="
          echo "=== Postgres Logs ==="
          echo "=========================================================="
          docker compose logs --tail 50 postgres
