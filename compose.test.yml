name: sqlfront-postgres-test

services:
  postgres-test:
    image: postgres:15
    environment:
      POSTGRES_DB: sqlfront_test
      POSTGRES_USER: sqlfront_test
      POSTGRES_PASSWORD: sqlfront_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "sqlfront_test", "-d", "sqlfront_test"]
      interval: 2s
      timeout: 3s
      retries: 20
